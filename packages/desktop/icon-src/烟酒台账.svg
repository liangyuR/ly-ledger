<!--
  烟酒台账图标 —— 完整版，48px 及以上用这个。
  16/24/32 用 烟酒台账-small.svg：那个尺寸下标签上的两条横线会糊成一团灰。

  配色取自界面主题（packages/web/src/styles/index.css 的 @theme）：
  深绿 #17705a→#0b3d31 是 brand，瓶身 #f5f5f3 是 page 底色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17705a"/>
      <stop offset="1" stop-color="#0b3d31"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 瓶盖 -->
  <rect x="106" y="30" width="44" height="28" rx="7" fill="#f5f5f3"/>

  <!-- 瓶身：两侧竖直、肩部收紧。斜肩会看着像烧瓶 -->
  <path fill="#f5f5f3" d="
    M112 56 h32 v46
    C 144 120, 186 124, 186 152
    V 210 a18 18 0 0 1 -18 18
    H 88 a18 18 0 0 1 -18 -18
    V 152
    C 70 124, 112 120, 112 102
    Z"/>

  <!-- 标签：挖空一块，里面两条横线 —— 「记了账的酒」 -->
  <rect x="70" y="158" width="116" height="44" fill="#0b3d31"/>
  <rect x="84" y="168" width="88" height="8" rx="4" fill="#f5f5f3"/>
  <rect x="84" y="184" width="56" height="8" rx="4" fill="#f5f5f3"/>
</svg>
