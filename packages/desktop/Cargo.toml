[package]
name = "ly-ledger"
version = "0.1.0"
edition = "2021"
description = "烟酒店进销存台账"
authors = ["ly-ledger"]

[dependencies]
calamine = "0.36.1"
chrono = "0.4.45"
pinyin = "0.11.0"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
thiserror = "2.0.20"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
